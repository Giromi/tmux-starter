# tmux starter config (tmux 3.2 or newer)
# 설치: 이 파일을 ~/.tmux.conf 로 복사하면 끝. 자세한 설명은 README.md 를 보세요.
# 설정을 바꾼 뒤에는 tmux 안에서  Ctrl+t  를 누르고 손을 뗀 다음  r  을 누르면 바로 적용됩니다.

# ───────────── 기본 ─────────────
# 색: 256색 + 트루컬러
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Esc 를 눌렀을 때 지연 없애기 (vim / nvim 쓸 때 편합니다)
set -s escape-time 0

# 마우스: 창 클릭, 크기 조절, 스크롤, 드래그로 글자 선택
set -g mouse on

# 지나간 화면을 거슬러 볼 수 있는 줄 수
set -g history-limit 10000

# 창 번호를 1부터 (키보드 숫자 줄과 순서가 같아집니다), 창을 닫으면 번호를 다시 채움
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 여러 화면(클라이언트)이 붙어 있으면 마지막으로 쓴 쪽 크기에 맞춤
set -g window-size latest
setw -g aggressive-resize on

# 세션 하나를 닫아도 tmux 에서 튕겨 나가지 않고 다른 세션으로 이동
set -g detach-on-destroy off

# 다른 프로그램(vim 등)이 포커스 변화를 알 수 있게
set -g focus-events on

# 새 버전 tmux 에서만 있는 옵션은 -q 를 붙여서, 오래된 tmux 에서도 오류 없이 넘어갑니다
set -sq extended-keys on
set -sq set-clipboard on

# 안내 메시지가 화면에 머무는 시간 (밀리초)
set -g display-time 2000

# ───────────── 접두 키 (prefix) ─────────────
# 모든 tmux 단축키는 먼저 접두 키를 누르고, 손을 뗀 다음 나머지 키를 누릅니다.
# 기본값 Ctrl+b 대신 Ctrl+t 를 씁니다. 다른 키로 바꾸고 싶으면 아래 두 줄의 C-t 를 바꾸세요.
set -g prefix C-t
unbind C-b

# ───────────── 단축키 ─────────────
# 도움말: 접두 키 → ?  (-N 으로 달아 둔 설명이 목록에 나옵니다)

# 설정 다시 읽기
bind -N "reload ~/.tmux.conf" r source-file ~/.tmux.conf \; display-message "설정을 다시 읽었어요"

# 창 나누기: | 는 좌우로, _ 는 위아래로 (지금 폴더에서 이어서 시작)
unbind '"'
unbind %
bind -N "split left/right" | split-window -h -c "#{pane_current_path}"
bind -N "split top/bottom" _ split-window -v -c "#{pane_current_path}"
bind -N "new window (same folder)" c new-window -c "#{pane_current_path}"

# 창 사이 이동: vim 처럼 h 왼쪽, j 아래, k 위, l 오른쪽
bind -N "select pane left"  h select-pane -L
bind -N "select pane below" j select-pane -D
bind -N "select pane above" k select-pane -U
bind -N "select pane right" l select-pane -R
bind -N "last pane" w select-pane -l

# 직전에 보던 창(window)으로: 접두 키 → t  또는  접두 키 → 접두 키 (Ctrl+t 를 한 번 더)
bind -N "last window" t last-window
bind -N "last window" C-t last-window

# 창 크기 조절: Ctrl+방향키, 또는 Shift+h/j/k/l. 누른 채 반복할 수 있어요
bind -r -N "resize pane up 5"    C-Up    resize-pane -U 5
bind -r -N "resize pane down 5"  C-Down  resize-pane -D 5
bind -r -N "resize pane left 5"  C-Left  resize-pane -L 5
bind -r -N "resize pane right 5" C-Right resize-pane -R 5
bind -r -N "resize pane up 5"    K resize-pane -U 5
bind -r -N "resize pane down 5"  J resize-pane -D 5
bind -r -N "resize pane left 5"  H resize-pane -L 5
bind -r -N "resize pane right 5" L resize-pane -R 5

# 이름 바꾸기 (tmux 기본 키와 같지만 목록에 설명이 보이도록 다시 적어 둠)
bind -N "rename window"  , command-prompt -I "#W" "rename-window -- '%%'"
bind -N "rename session" '$' command-prompt -I "#S" "rename-session -- '%%'"

# 모든 창에 동시에 입력: 접두 키 → S. 켤 때는 한 번 물어봅니다. 켜져 있는 동안 왼쪽 아래에 빨간 표시가 뜹니다.
bind -N "type into ALL panes at once: on (asks first) / off" S if -F '#{pane_synchronized}' \
  'setw synchronize-panes off' \
  'confirm-before -p "이 창의 모든 칸에 동시에 입력할까요? (y/n)" "setw synchronize-panes on"'

# ───────────── 복사 모드 (vi 키) ─────────────
# 접두 키 → [ 로 들어가서 화살표나 h j k l 로 움직이고, v 로 선택 시작, y 로 복사, q 로 나옵니다.
# 마우스로 드래그만 해도 복사됩니다.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# 터미널이 시스템 클립보드로 복사를 지원하지 않으면, 쓰는 운영체제에 맞는 줄 하나의 맨 앞 # 을 지우세요:
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"                      # macOS
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"  # Linux (xclip 설치 필요)

# ───────────── 아래쪽 상태 줄 ─────────────
set -g status on
set -g status-interval 15
set -g status-style "bg=colour235,fg=colour136"
set -g status-left-length 30
set -g status-left "#{?pane_synchronized,#[bg=red#,fg=white#,bold] ⚠ 동시 입력 #[default] ,}[#S] "
set -g status-right-length 60
set -g status-right "%H:%M  %d-%b-%y "
setw -g window-status-format "#I:#W#F"
setw -g window-status-current-format "#[bold]#I:#W#F"
setw -g window-status-current-style "fg=colour178"

# 안내 메시지와 : 입력줄 색
set -g message-style "bg=colour236,fg=colour178"
set -g message-command-style "bg=colour236,fg=colour250"

# 창 경계선: 평소 회색, 지금 쓰는 칸은 금색, 동시 입력이 켜져 있으면 빨간색
set -g pane-border-style "#{?pane_synchronized,fg=red,fg=colour242}"
set -g pane-active-border-style "#{?pane_synchronized,fg=red,fg=colour178}"

# 이 파일을 ~/.tmux.conf 외의 곳에 두었다면, 위의 reload 줄(r)의 경로를 같이 바꾸세요.

# ───────────── 플러그인 (선택 사항) ─────────────
# 꼭 필요하지 않습니다. 쓰려면 README.md 의 "플러그인" 부분을 먼저 읽고,
# 아래 줄들의 맨 앞 # 을 지우세요. (설치용 git clone 이 먼저 필요합니다)
